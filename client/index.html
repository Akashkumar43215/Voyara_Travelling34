<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>VOYARA | Smart Travel India</title>
    <meta
      name="description"
      content="Plan and book trips across India with VOYARA. Explore all 36 states and union territories, find hotels near the places you want to visit, add meals, local travel and activities, and book in one flow."
    />
    <meta name="theme-color" content="#0f55c8" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved (or system) theme before the page paints, so there is no white flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("voyara_theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VOYARA" />
    <meta property="og:title" content="VOYARA | Smart Travel India" />
    <meta
      property="og:description"
      content="Explore India's 36 states and UTs, find hotels near the places you want to visit, and book your whole trip in one flow."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;900&family=Noto+Sans+Oriya:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <noscript>VOYARA needs JavaScript to run. Please turn it on in your browser and reload the page.</noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
